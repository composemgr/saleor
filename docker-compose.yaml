# nginx proxy address - http://172.17.0.1:8083

name: saleor
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  saleor:
    image: ghcr.io/saleor/saleor:latest
    pull_policy: always
    container_name: saleor-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - saleor
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8083:8000"
    environment:
      TZ: ${TZ:-America/New_York}
      SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DATABASE_URL: postgresql://${DB_USER_NAME:-saleor}:${DB_USER_PASS:-changeme_db_password}@saleor-db:5432/${DB_CREATE_DATABASE_NAME:-saleor}
      REDIS_URL: redis://saleor-redis:6379/0
      ALLOWED_HOSTS: ${BASE_HOST_NAME:-localhost},${BASE_DOMAIN_NAME:-example.com}
      DEFAULT_FROM_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      EMAIL_URL: smtp://${EMAIL_SERVER_HOST:-localhost}:${EMAIL_SERVER_PORT:-25}
      DEFAULT_CURRENCY: USD
      CONTAINER_NAME: saleor-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/saleor/media:/app/media
    depends_on:
      saleor-db:
        condition: service_healthy
      saleor-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://saleor-app:8000'
      - 'cloudflare.hostname=saleor.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.saleor-app.entrypoints=http'
      - 'traefik.http.routers.saleor-app-secure.tls=true'
      - 'traefik.http.routers.saleor-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.saleor-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.saleor-app.middlewares=saleor-app-https-redirect'
      - 'traefik.http.routers.saleor-app-secure.entrypoints=https'
      - 'traefik.http.routers.saleor-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.saleor-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.saleor-app-secure.service=saleor-app'
      - 'traefik.http.services.saleor-app.loadbalancer.server.port=8000'

  saleor-db:
    image: postgres:latest
    pull_policy: always
    container_name: saleor-db
    hostname: saleor-db
    restart: always
    logging: *default-logging
    networks:
      - saleor
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-saleor}
      POSTGRES_USER: ${DB_USER_NAME:-saleor}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: saleor-db
    volumes:
      - ./volumes/data/db/postgres/saleor:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  saleor-redis:
    image: redis:alpine
    pull_policy: always
    container_name: saleor-redis
    hostname: saleor-redis
    restart: always
    logging: *default-logging
    networks:
      - saleor
    volumes:
      - ./volumes/data/db/redis/saleor:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      CONTAINER_NAME: saleor-redis

networks:
  saleor:
    name: saleor
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
