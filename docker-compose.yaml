# nginx proxy address - http://172.17.0.1:8083

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  saleor:
    image: ghcr.io/saleor/saleor:latest
    container_name: saleor-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - saleor
    ports:
      - "8083:8000"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/data/saleor:/data
      - ./volumes/config/saleor:/config
    depends_on:
      - saleor-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  saleor-db:
    image: postgres:16-alpine
    container_name: saleor-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - saleor
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-saleor}
      POSTGRES_USER: ${DB_USER_NAME:-saleor}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/saleor:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  saleor:
    external: false
